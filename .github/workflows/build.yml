name: Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the add-on
        run: dotnet build SplashAddonPlus.csproj -c Release

      - name: Run the tests
        run: dotnet run --project Tests/SplashAddonPlus.Tests.csproj -c Release

      - name: Create the .pext package
        run: |
          version=$(grep '^Version:' extension.yaml | awk '{print $2}')
          name="SplashAddonPlus_Ad1Bb_${version//./_}.pext"
          mkdir package
          cp bin/Release/SplashAddonPlus.dll extension.yaml icon.png package/
          (cd package && zip -q "../$name" SplashAddonPlus.dll extension.yaml icon.png)
          echo "PEXT=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pext
          path: ${{ env.PEXT }}

      # Pushing a tag such as 1.0.0 publishes a release with the package attached.
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Splash Addon Plus $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$PEXT" --clobber
